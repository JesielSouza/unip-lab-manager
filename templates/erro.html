<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNIP Lab Manager | Erro {{ codigo }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --unip-blue: #003366;
            --unip-gold: #f5b915;
        }
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }
        .navbar-unip {
            background: var(--unip-blue);
            border-bottom: 4px solid var(--unip-gold);
        }
        .erro-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .erro-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            padding: 3rem 2.5rem;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .erro-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        .erro-codigo {
            font-size: 5rem;
            font-weight: 900;
            color: var(--unip-blue);
            line-height: 1;
            margin-bottom: 0.25rem;
        }
        .erro-titulo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.75rem;
        }
        .erro-mensagem {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }
        .btn-voltar {
            background: var(--unip-blue);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 28px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }
        .btn-voltar:hover {
            background: #002244;
            color: white;
        }
        {% if codigo == 500 %}
        .erro-icon { color: #dc2626; }
        .erro-codigo { color: #dc2626; }
        {% elif codigo == 404 %}
        .erro-icon { color: #f59e0b; }
        .erro-codigo { color: #f59e0b; }
        {% elif codigo == 403 %}
        .erro-icon { color: #7c3aed; }
        .erro-codigo { color: #7c3aed; }
        {% else %}
        .erro-icon { color: #64748b; }
        .erro-codigo { color: #64748b; }
        {% endif %}
    </style>
</head>
<body>

<nav class="navbar navbar-dark navbar-unip shadow-sm" style="padding:0.6rem 0;">
    <div class="container d-flex align-items-center justify-content-between">
        <span class="navbar-brand fw-bold mb-0" style="font-size:0.95rem;">
            <i class="bi bi-mortarboard-fill me-1"></i> UNIP Lab Manager
        </span>
    </div>
</nav>

<div class="erro-container">
    <div class="erro-card">
        <div class="erro-icon">
            <i class="bi {{ icone }}"></i>
        </div>
        <div class="erro-codigo">{{ codigo }}</div>
        <div class="erro-titulo">{{ titulo }}</div>
        <p class="erro-mensagem">{{ mensagem }}</p>
        <a href="javascript:history.back()" class="btn-voltar me-2">
            <i class="bi bi-arrow-left me-1"></i> Voltar
        </a>
        <a href="/painel_unip" class="btn-voltar" style="background:#f1f5f9;color:#003366;">
            <i class="bi bi-house me-1"></i> Painel
        </a>
    </div>
</div>

</body>
</html>
