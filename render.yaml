services:
  - type: web
    name: unip-lab-manager
    runtime: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn -w 1 --timeout 60 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: unip-lab-db
          property: connectionString
      - key: FLASK_DEBUG
        value: false
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: unip-lab-db
    databaseName: uniplab
    user: uniplab
    plan: free
